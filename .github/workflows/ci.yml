name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  ci:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-ci.yml@v2.5.1
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      actions: read
      checks: write
      security-events: write
    with:
      pixi-environment: "ci"
      python-versions: '["3.10", "3.11", "3.12", "3.14"]'
      os-matrix: '["ubuntu-latest"]'
      enable-performance: false
      enable-hygiene-check: true
      editable-install: false
      package-path: "."
      allowed-licenses: "MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, PSF-2.0, LGPL-3.0"
    secrets: inherit

  branch-policy:
    name: "Branch Policy"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch policy
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          # Rule 1: PRs to main must come from development only
          if [ "$BASE" = "main" ] && [ "$HEAD" != "development" ]; then
            echo "❌ PRs to main must come from development branch"
            echo "   Source: $HEAD"
            echo "   Expected: development"
            exit 1
          fi

          # Rule 2: applications branch must never be merged into main or development
          if [ "$HEAD" = "applications" ]; then
            echo "❌ applications branch must not be merged into $BASE"
            echo "   applications is a downstream consumer of development, not a source"
            exit 1
          fi

          echo "✅ Branch policy passed: $HEAD → $BASE"

  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
