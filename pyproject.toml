[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ["py39"]
preview = true

[tool.isort]
profile = "black"
add_imports = ["from __future__ import annotations"]

[tool.unimport]
remove = true
ignore_init = true

[tool.mypy]
no_warn_no_return = true
disallow_incomplete_defs = false
disable_error_code = ["attr-defined", "assignment", "arg-type", "union-attr", "operator", "call-arg", "call-overload", "misc", "no-redef", "override", "return-value", "index"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Upstream library source — avoid modifying to minimise merge conflicts
"refactor/*.py" = [
    "UP006", "UP007", "UP035",  # deprecated typing generics / imports
    "UP031",  # % formatting
    "B006",   # mutable default argument
    "B007",   # loop variable not used
    "B008",   # function call in default argument
    "B023",   # function defined in loop captures loop variable
    "B024",   # abstract base class without abstract methods
    "E731",   # lambda assignment
    "E741",   # ambiguous variable name
    "F401",   # imported but unused (re-exports in __init__.py)
    "F402",   # import shadowed by loop variable
    "F403",   # wildcard import
    "F811",   # redefinition of unused name
    "F841",   # unused variable
    "W291",   # trailing whitespace
    "W293",   # whitespace on blank line
    "B020",   # loop variable overrides iterable
    "B904",   # raise from within except
    "B905",   # zip strict
]
"refactor/internal/*.py" = [
    "UP006", "UP007", "UP035",
    "B006", "B007", "B008", "B023", "B024",
    "B904", "B905",
    "E731", "E741",
    "F401", "F811",
]
# Examples are illustrative, not production code
"examples/**/*.py" = ["ALL"]
# Tests — allow assert statements and some flexibility
"tests/*.py" = [
    "B011",  # assert False
    "B007",  # unused loop variable
    "B905",  # zip strict
    "F841",  # unused variable
    "W293",  # whitespace on blank line (test fixtures with intentional whitespace)
    "UP006", "UP007", "UP035",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["refactor"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["/tests"]
skips = ["B101"]
